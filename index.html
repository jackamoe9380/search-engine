<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, sans-serif;
        }

        body {
            background: white;
        }

        .search-wrapper {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        #search-input {
            flex: 1;
            min-width: 0;
            height: 50px;
            padding: 0 16px;
            font-size: 17px;
            border: 1px solid #ccc;
            border-radius: 10px;
            outline: none;
        }

        #search-input:focus {
            border-color: #4285f4;
        }

        #search-button {
            height: 50px;
            padding: 0 24px;
            border: 0;
            border-radius: 10px;
            background: #4285f4;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #search-button:hover {
            opacity: 0.9;
        }

        @media (max-width: 600px) {

            .search-wrapper {
                padding: 12px;
            }

            .search-box {
                flex-direction: column;
            }

            #search-input,
            #search-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="search-wrapper">

    <form id="search-form">

        <div class="search-box">

            <input
                id="search-input"
                type="search"
                placeholder="Search..."
                autocomplete="off"
                required
            >

            <button
                id="search-button"
                type="submit">
                Search
            </button>

        </div>

    </form>

</div>

<script>

const SEARCH_ENGINE_ID =
    "1759385bff2884f71";

const searchForm =
    document.getElementById("search-form");

const searchInput =
    document.getElementById("search-input");


searchForm.addEventListener("submit", function(event) {

    event.preventDefault();

    const query =
        searchInput.value.trim();

    if (!query) {
        return;
    }

    /*
     * Build the Google Programmable Search URL.
     */
    const searchURL =
        "https://cse.google.com/cse?cx=" +
        encodeURIComponent(SEARCH_ENGINE_ID) +
        "&q=" +
        encodeURIComponent(query);

    /*
     * Create a completely blank browsing context.
     */
    const newWindow =
        window.open("about:blank", "_blank");

    /*
     * Check whether the browser blocked it.
     */
    if (!newWindow) {

        alert(
            "Your browser blocked the new tab. " +
            "Please allow pop-ups for this site."
        );

        return;
    }

    /*
     * Navigate the blank page to Google CSE.
     */
    newWindow.location.href =
        searchURL;

});

</script>

</body>
</html>
