<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, sans-serif;
        }

        body {
            background: white;
        }

        #search-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 12px;
        }

        /*
         * Keep Google's search element responsive.
         */
        .gsc-control-cse {
            width: 100% !important;
            padding: 0 !important;
            border: 0 !important;
            background: transparent !important;
        }

        .gsc-search-box {
            width: 100% !important;
        }

        .gsc-input-box {
            min-height: 44px !important;
            border-radius: 10px !important;
        }

        .gsc-search-button-v2 {
            min-height: 44px !important;
            min-width: 50px !important;
            border-radius: 10px !important;
        }

        /*
         * Make results fit smaller screens.
         */
        .gsc-results {
            width: 100% !important;
        }

        .gsc-result {
            width: 100% !important;
            padding: 14px 4px !important;
        }

        .gs-title {
            font-size: 18px !important;
        }

        .gs-visibleUrl {
            word-break: break-word;
        }

        @media (max-width: 600px) {
            #search-container {
                padding: 6px;
            }

            .gs-title {
                font-size: 16px !important;
            }

            .gsc-result {
                padding: 12px 2px !important;
            }
        }
    </style>

    <!-- Google Programmable Search -->
    <script
        async
        src="https://cse.google.com/cse.js?cx=1759385bff2884f71">
    </script>
</head>

<body>

    <div id="search-container">

        <div class="gcse-search"></div>

    </div>

    <script>
        /*
         * Wait for Google's search results to appear.
         * Then attach our own click handler to result links.
         */

        const observer = new MutationObserver(function () {

            const links = document.querySelectorAll(
                ".gsc-result a.gs-title"
            );

            links.forEach(function (link) {

                if (link.dataset.aboutBlankHandler) {
                    return;
                }

                link.dataset.aboutBlankHandler = "true";

                link.addEventListener("click", function (event) {

                    event.preventDefault();
                    event.stopPropagation();

                    const url = link.href;

                    if (!url) {
                        return;
                    }

                    /*
                     * Open a blank tab first.
                     */
                    const newWindow =
                        window.open("about:blank", "_blank");

                    /*
                     * If the browser blocked the popup,
                     * tell the user what happened.
                     */
                    if (!newWindow) {
                        alert(
                            "Please allow pop-ups for this search page."
                        );
                        return;
                    }

                    /*
                     * Navigate the blank page to the
                     * selected search result.
                     */
                    newWindow.location.replace(url);
                });
            });

        });

        /*
         * Watch the search-result area because Google
         * dynamically creates and replaces results.
         */
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    </script>

</body>
</html>
